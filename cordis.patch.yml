# dsh-enhanced-model-selector bundle patch.
# Inserts the plugin row into the profile's Cordis loader roster.
# The browser half rides the package's dsh.client manifest (the client
# registry serves lib/client.js); this row creates the loader entry/fiber
# that makes client-modules recognize the package as a live client bundle.
- insert:
    - id: dsh-enhanced-model-selector
      name: 'dsh-enhanced-model-selector'
